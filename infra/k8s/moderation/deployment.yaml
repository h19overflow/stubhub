apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation
  namespace: stubhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moderation
  template:
    metadata:
      labels:
        app: moderation
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: moderation
          image: stubhub-moderation
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3004"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stubhub-jwt
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stubhub-internal-service
                  key: INTERNAL_SERVICE_TOKEN
            - name: IDENTITY_SERVICE_URL
              value: http://identity:3001
            - name: ORDERS_SERVICE_URL
              value: http://orders:3003
            - name: MODERATION_DB_PATH
              value: /data/moderation.sqlite
          ports:
            - name: http
              containerPort: 3004
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: moderation-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
      volumes:
        - name: moderation-data
          persistentVolumeClaim:
            claimName: moderation-data
