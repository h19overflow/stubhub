apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets
  namespace: stubhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tickets
  template:
    metadata:
      labels:
        app: tickets
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tickets
          image: stubhub-tickets
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3002"
          ports:
            - name: http
              containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
