apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets
  namespace: stubhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tickets
  template:
    metadata:
      labels:
        app: tickets
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
        - name: tickets
          image: stubhub-tickets
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3002"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stubhub-jwt
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stubhub-internal-service
                  key: INTERNAL_SERVICE_TOKEN
            - name: REDIS_URL
              value: redis://redis:6379
            - name: TICKETS_DB_PATH
              value: /data/tickets.sqlite
            - name: TICKETS_UPLOAD_DIR
              value: /data/uploads
          ports:
            - name: http
              containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tickets-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
      volumes:
        - name: tickets-data
          persistentVolumeClaim:
            claimName: tickets-data
