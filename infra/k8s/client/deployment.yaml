apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: stubhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: stubhub-client
          imagePullPolicy: IfNotPresent
          env:
            - name: IDENTITY_SERVICE_URL
              value: http://identity:3001
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
