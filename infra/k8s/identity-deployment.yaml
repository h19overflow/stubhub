apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: stubhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity
          image: stubhub-identity
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3001"
            - name: IDENTITY_DB_PATH
              value: /data/identity.sqlite
            - name: SMTP_HOST
              value: mailpit
            - name: SMTP_PORT
              value: "1025"
          volumeMounts:
            - name: identity-data
              mountPath: /data
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
      volumes:
        - name: identity-data
          persistentVolumeClaim:
            claimName: identity-data
